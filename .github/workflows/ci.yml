name: Storyhouse CI

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test, lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: ESLint (excluding the repository-wide Prettier baseline)
        run: "bunx eslint . --rule 'prettier/prettier: off'"
      - name: TypeScript application type check
        run: bunx tsc --noEmit -p tsconfig.ci.json
      - name: Production build
        run: bun run build
